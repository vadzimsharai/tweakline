name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          npm ci --prefix relay
          npm ci --prefix extension
      - name: Unit tests
        run: |
          npm test --prefix relay
          npm test --prefix extension
      # playwright-core's own installer fetches the Chromium build that matches its pinned version.
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
        working-directory: extension
      - name: End-to-end tests
        run: npm run e2e
        working-directory: extension
      - name: Build files
        run: |
          mkdir -p out
          npm run build --prefix relay
          cp relay/dist/tweakline.cjs out/tweakline-server.js
          cp "$(node relay/cli.mjs pack)" out/tweakline-extension.zip
          (cd skill && zip -qr ../out/tweakline-skill.zip tweakline)
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## / { found = index($0, "## " v " ") == 1 || $0 == "## " v; next } found' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          cat >> notes.md <<'NOTES'

          ### Files

          | File | What it is |
          |---|---|
          | `tweakline-extension.zip` | The browser extension. Unzip, open `chrome://extensions`, turn on Developer mode, **Load unpacked**. To update, replace the files and press reload: your data stays. |
          | `tweakline-server.js` | The server. Needs Node.js 22+: `node tweakline-server.js` |
          | `tweakline-skill.zip` | A skill for your AI agent. Unzip into its skills folder, for Claude Code `~/.claude/skills/`. |

          Setup: [Quick start](https://github.com/vadzimsharai/tweakline#quick-start).
          NOTES
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --title "Tweakline $GITHUB_REF_NAME" --notes-file notes.md --verify-tag \
            || { gh release edit "$GITHUB_REF_NAME" --notes-file notes.md && gh release upload "$GITHUB_REF_NAME" out/* --clobber; }
